version: 2

# One reviewable monthly bundle across packages and GitHub Actions. A monthly
# schedule alone does not group updates or suppress the initial scan.
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    commit-message:
      prefix: chore(deps)

updates:
  # Dependabot uses the npm ecosystem for pnpm and updates pnpm-lock.yaml.
  - package-ecosystem: npm
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
